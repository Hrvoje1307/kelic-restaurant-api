basePath: /api/v1
definitions:
  models.AvailabilityResponse:
    properties:
      available_slots:
        items:
          $ref: '#/definitions/models.TimeSlot'
        type: array
      date:
        type: string
    type: object
  models.ChatMessage:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  models.ChatRequest:
    properties:
      message:
        type: string
      session_id:
        type: string
    required:
    - message
    - session_id
    type: object
  models.ChatResponse:
    properties:
      done:
        type: boolean
      message:
        type: string
      session_id:
        type: string
    type: object
  models.ChatSession:
    properties:
      messages:
        items:
          $ref: '#/definitions/models.ChatMessage'
        type: array
      session_id:
        type: string
    type: object
  models.ChatSessionSummary:
    properties:
      message_count:
        type: integer
      session_id:
        type: string
      updated_at:
        type: string
    type: object
  models.MenuCategory:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  models.MenuCategoryInput:
    properties:
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    required:
    - name
    type: object
  models.MenuItem:
    properties:
      allergens:
        items:
          type: string
        type: array
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_available:
        type: boolean
      name:
        type: string
      price:
        type: number
      sort_order:
        type: integer
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  models.MenuItemInput:
    properties:
      allergens:
        items:
          type: string
        type: array
      category_id:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_available:
        type: boolean
      name:
        type: string
      price:
        type: number
      sort_order:
        type: integer
      tags:
        items:
          type: string
        type: array
    required:
    - name
    - price
    type: object
  models.Reservation:
    properties:
      created_at:
        type: string
      duration_mins:
        type: integer
      guest_email:
        type: string
      guest_name:
        type: string
      guest_phone:
        type: string
      id:
        type: string
      notes:
        type: string
      party_size:
        type: integer
      reserved_at:
        type: string
      status:
        type: string
      table_id:
        type: string
      updated_at:
        type: string
    type: object
  models.ReservationInput:
    properties:
      duration_mins:
        type: integer
      guest_email:
        type: string
      guest_name:
        type: string
      guest_phone:
        type: string
      notes:
        type: string
      party_size:
        maximum: 20
        minimum: 1
        type: integer
      reserved_at:
        type: string
      table_id:
        type: string
    required:
    - guest_email
    - guest_name
    - party_size
    - reserved_at
    type: object
  models.ReservationStatusUpdate:
    properties:
      status:
        enum:
        - pending
        - confirmed
        - cancelled
        - completed
        type: string
    required:
    - status
    type: object
  models.Table:
    properties:
      capacity:
        type: integer
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      location:
        type: string
      table_number:
        type: integer
    type: object
  models.TableInput:
    properties:
      capacity:
        minimum: 1
        type: integer
      is_active:
        type: boolean
      location:
        enum:
        - unutra
        - terasa
        - vip
        type: string
      table_number:
        type: integer
    required:
    - capacity
    - table_number
    type: object
  models.TimeSlot:
    properties:
      available_tables:
        items:
          $ref: '#/definitions/models.Table'
        type: array
      time:
        type: string
    type: object
  models.UserProfile:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  models.UserProfileInput:
    properties:
      avatar_url:
        type: string
      full_name:
        type: string
      phone:
        type: string
    type: object
  models.UserRoleUpdate:
    properties:
      role:
        enum:
        - guest
        - admin
        - superadmin
        type: string
    required:
    - role
    type: object
